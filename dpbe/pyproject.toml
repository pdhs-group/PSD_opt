[tool.poetry]
name = "dpbe"
version = "0.7.0"
description = "Discrete Population Balance Equation (dPBE) solvers."
authors = ["HR94 <haoran.ji@kit.edu>"]
license = "GPL-3.0-only"
packages = [
    { include = "dpbe", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.9,<3.12"
numpy = "^2.3.5"
scipy = "^1.16.3"
matplotlib = "^3.10.8"
pbe-core = "^0.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
